name: Prakrishta.GraphqlHttpClient Build

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - 'README.md'
      - '**/*.md'
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-publish-coverage:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore src/GraphqlHttpClient/GraphqlHttpClient.csproj

    - name: Build
      run: dotnet build ..\GraphqlHttpClient\GraphqlHttpClient --configuration Release --no-restore
